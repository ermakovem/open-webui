<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		https://docs.openwebui.com/license. -->
		<link rel="icon" type="image/png" href="/static/favicon.png" crossorigin="use-credentials" />
		<link
			rel="icon"
			type="image/png"
			href="/static/favicon-96x96.png"
			sizes="96x96"
			crossorigin="use-credentials"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/static/favicon.svg"
			crossorigin="use-credentials"
		/>
		<link rel="shortcut icon" href="/static/favicon.ico" crossorigin="use-credentials" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				document.documentElement.classList.toggle(
					'native-scrollbars',
					/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
						// iPadOS can report a desktop Mac user agent.
						(/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
				);

				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				// OLED Dark is now the dark theme with a black background colour.
				if (localStorage.theme === 'oled-dark') {
					localStorage.theme = 'dark';
					try {
						const colors = JSON.parse(localStorage.themeColors ?? '{}');
						colors.dark ??= { bg: '#000000', fg: '#ffffff' };
						localStorage.themeColors = JSON.stringify(colors);
					} catch {}
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				// User theme colours; keep in sync with applyThemeColors in $lib/utils/theme.
				const applyThemeColors = () => {
					const root = document.documentElement;
					let colors;
					try {
						colors = JSON.parse(localStorage.themeColors ?? '{}')[
							root.classList.contains('dark') ? 'dark' : 'light'
						];
					} catch {}
					if (colors && !root.classList.contains('her')) {
						root.style.setProperty('--app-bg', colors.bg);
						root.style.setProperty('--app-fg', colors.fg);
						metaThemeColorTag.setAttribute('content', colors.bg);
					} else {
						root.style.removeProperty('--app-bg');
						root.style.removeProperty('--app-fg');
					}
				};
				applyThemeColors();

				// LICENSE covers these Open WebUI splash logo assets.
				// Do not alter, remove, obscure, or replace them except as LICENSE permits:
				// https://docs.openwebui.com/license.
				const preloadHref = document.documentElement.classList.contains('dark')
					? '/static/splash-dark.png'
					: '/static/splash.png';
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
						applyThemeColors();
					}
				});
			})();
		</script>

		<style type="text/css" nonce="">
			html {
				overflow-y: hidden !important;
				overscroll-behavior-y: none;
			}

			#splash-screen {
				background: #fff;
			}

			html.dark #splash-screen {
				background: #000;
			}

			html.her #splash-screen {
				background: #983724;
			}

			#splash-screen #logo {
				position: absolute;
				top: 44%;
				width: 100%;
				height: 6rem;
				transform: translateY(-50%);
				background: url('/static/splash.png') center / contain no-repeat;
			}

			html.dark #splash-screen #logo {
				background-image: url('/static/splash-dark.png');
			}

			#logo-her {
				display: none;
			}

			#progress-background {
				display: none;
			}

			#progress-bar {
				display: none;
			}

			html.her #logo {
				display: none;
			}

			html.her #logo-her {
				display: block;
				filter: invert(1);
			}

			html.her #progress-background {
				display: block;
			}

			html.her #progress-bar {
				display: block;
			}

			@media (max-width: 24rem) {
				html.her #progress-background {
					display: none;
				}

				html.her #progress-bar {
					display: none;
				}
			}

			@keyframes pulse {
				50% {
					opacity: 0.65;
				}
			}

			.animate-pulse-fast {
				animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
			}

			#nmb-startup {
				position: fixed;
				inset: 0;
				z-index: 101;
				font: 16px system-ui, sans-serif;
				color: var(--app-fg, #171717);
				pointer-events: none;
			}

			html.dark #nmb-startup {
				color: var(--app-fg, #fafafa);
			}

			#nmb-startup-form {
				box-sizing: border-box;
				position: absolute;
				top: 57%;
				left: 50%;
				transform: translateX(-50%);
				width: min(48rem, calc(100% - 2rem));
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 0.5rem;
				padding: 0.75rem;
				border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
				border-radius: 1.25rem;
				background: var(--app-bg, #fff);
				pointer-events: auto;
			}

			html.dark #nmb-startup-form {
				background: var(--app-bg, #171717);
			}

			#nmb-startup-input {
				box-sizing: border-box;
				width: 100%;
				min-height: 3rem;
				padding: 0.35rem;
				resize: none;
				border: 0;
				border-radius: 0.4rem;
				background: transparent;
				color: inherit;
				font: inherit;
			}

			#nmb-startup-send {
				align-self: end;
				width: 2.75rem;
				height: 2.75rem;
				border: 0;
				border-radius: 50%;
				background: #171717;
				color: #fff;
				font: 600 1.4rem system-ui, sans-serif;
			}

			html.dark #nmb-startup-send {
				background: #fafafa;
				color: #171717;
			}

			#nmb-startup-send:disabled {
				opacity: 0.5;
			}

			#nmb-startup-status {
				grid-column: 1 / -1;
				font-size: 0.875rem;
			}

			#nmb-startup-status:empty {
				display: none;
			}

			@media (max-width: 640px) {
				#nmb-startup-form {
					top: auto;
					bottom: max(0.75rem, env(safe-area-inset-bottom));
				}
			}
		</style>

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />
		<title>Open WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<!-- LICENSE covers this Open WebUI splash logo.
			Do not alter, remove, obscure, or replace it except as LICENSE permits:
			https://docs.openwebui.com/license. -->
			<div id="logo" aria-hidden="true"></div>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<!-- LICENSE covers this Open WebUI splash logo.
				Do not alter, remove, obscure, or replace it except as LICENSE permits:
				https://docs.openwebui.com/license. -->
				<img
					id="logo-her"
					alt=""
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
		<div id="nmb-startup" hidden>
			<form id="nmb-startup-form">
				<textarea id="nmb-startup-input" rows="2" aria-label="Message" placeholder="Message"></textarea>
				<button id="nmb-startup-send" type="submit" aria-label="Send message" disabled>↑</button>
				<div id="nmb-startup-status" role="status"></div>
			</form>
		</div>
		<script id="nmb-startup-script">
			(() => {
				if (location.pathname !== '/' || location.search || location.hash) return;

				const shell = document.getElementById('nmb-startup');
				const form = document.getElementById('nmb-startup-form');
				const input = document.getElementById('nmb-startup-input');
				const send = document.getElementById('nmb-startup-send');
				const status = document.getElementById('nmb-startup-status');
				const draftKey = 'nmb-startup-draft';
				const controller = new AbortController();
				const options = { signal: controller.signal };
				const russian = navigator.language.toLowerCase().startsWith('ru');
				const waiting = russian ? 'Отправим, когда чат загрузится' : 'Sending when chat is ready';
				const loadFailure = russian ? 'Не удалось загрузить чат' : 'Could not load chat';
				let owner = null;
				let queued = false;
				let composing = false;
				let insidePointer = null;
				let receive = null;
				let failed = false;

				try {
					const draft = JSON.parse(sessionStorage.getItem(draftKey));
					if (typeof draft?.text === 'string') {
						input.value = draft.text;
						owner = typeof draft.owner === 'string' ? draft.owner : null;
					}
				} catch {}
				const storeDraft = () => {
					try {
						if (input.value) sessionStorage.setItem(draftKey, JSON.stringify({ text: input.value, owner }));
						else sessionStorage.removeItem(draftKey);
					} catch {}
				};
				const dismiss = () => {
					queued = false;
					receive = null;
					controller.abort();
					shell.remove();
					delete window.nmbStartupComposer;
				};
				const fail = (message) => {
					receive = null;
					queued = false;
					if (!failed) status.textContent = message;
					failed = true;
					send.disabled = true;
				};
				const handoff = () => {
					if (!receive || composing || insidePointer !== null) return;
					if (!queued && form.contains(document.activeElement)) return;
					const handler = receive;
					const draft = { text: input.value, submit: queued };
					receive = null;
					queued = false;
					try {
						handler(draft);
					} catch (error) {
						fail(loadFailure);
						console.error(error);
						return;
					}
					dismiss();
					try {
						sessionStorage.removeItem(draftKey);
					} catch {}
				};

				input.addEventListener('input', () => {
					if (queued) {
						queued = false;
						status.textContent = '';
					}
					storeDraft();
				}, options);
				input.addEventListener('compositionstart', () => { composing = true; }, options);
				input.addEventListener('compositionend', () => {
					composing = false;
					queueMicrotask(handoff);
				}, options);
				form.addEventListener('pointerdown', (event) => { insidePointer = event.pointerId; }, options);
				const finishPointer = (event) => {
					if (insidePointer !== event.pointerId) return;
					setTimeout(() => {
						if (insidePointer === event.pointerId) insidePointer = null;
						handoff();
					}, 0);
				};
				window.addEventListener('pointerup', finishPointer, options);
				window.addEventListener('pointercancel', finishPointer, options);
				window.addEventListener('pagehide', () => {
					queued = false;
					if (!failed) status.textContent = '';
				}, options);
				// SvelteKit resets focus on its first client render. Its autofocus lookup
				// should find the same control that already has focus.
				form.addEventListener('focusin', (event) => {
					event.target.setAttribute('autofocus', '');
				}, options);
				form.addEventListener('focusout', (event) => {
					event.target.removeAttribute('autofocus');
					setTimeout(handoff, 0);
				}, options);
				form.addEventListener('submit', (event) => {
					event.preventDefault();
					if (failed || !input.value.trim()) return;
					storeDraft();
					queued = true;
					status.textContent = receive ? '' : waiting;
					handoff();
				}, options);

				window.nmbStartupComposer = {
					ready(handler) {
						receive = handler;
						failed = false;
						status.textContent = '';
						send.disabled = false;
						handoff();
					},
					fail,
					identify(id) {
						if (owner && owner !== id) {
							input.value = '';
							if (queued) status.textContent = '';
							queued = false;
						}
						owner = id;
						storeDraft();
					},
					dismiss
				};
				const failedToLoad = () => {
					if (!receive) fail(loadFailure);
				};
				window.addEventListener('unhandledrejection', (event) => {
					if (/^(Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module)/i.test(event.reason?.message ?? '')) {
						failedToLoad();
					}
				}, options);
				window.addEventListener('vite:preloadError', failedToLoad, options);
				if (russian) {
					input.placeholder = 'Сообщение';
					input.setAttribute('aria-label', 'Сообщение');
					send.setAttribute('aria-label', 'Отправить сообщение');
				}
				send.disabled = false;
				shell.hidden = false;
				const viewport = window.visualViewport;
				if (viewport) {
					const fitViewport = () => {
						shell.style.height = `${viewport.height}px`;
						shell.style.top = `${viewport.offsetTop}px`;
					};
					viewport.addEventListener('resize', fitViewport, options);
					viewport.addEventListener('scroll', fitViewport, options);
					fitViewport();
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
